#app/static/swagger.yaml

swagger: '2.0'
info:
  title: "Library API"
  description: "This is an API to manage a library"
  version: "1.0.0"
host: "127.0.0.1:5000"
schemes:
  - "http"
consumes:
  - "application/json"
produces:
  - "applicaiton/json"
paths: 
  /members/login:
    post:
      tags:
        - members
      summary: "Login endpoint, (generates token)"
      description: "Validates member credentials, generates and return a member specific token."
      parameters:
        - in: body
          name: body
          description: "Login Credentials"
          required: true
          schema: 
            $ref: "#/definitions/LoginCredentials"
      responses:
        "200":
          description: "Login sucessful"
          schema: 
            $ref: "#/definitions/LoginResponse"

    /members:
      post:
        tags:
          - Members
        summary: "Endpoint to create/register a new user."
        description: "Endpoint to create new member in our Library system, emails must be unique."
        parameters:
          - in: "body"
            name: "body"
            description: "Information required to create a new Member."
            required: true
            schema:
              $ref: "#/definitions/CreateMemberPayload" 
        responses:
          "201":
            descriptions: "Successfull Member Creation"
            schema:
              $ref: "#/definitions/CreateMemberResponse"
            examples:
              application/json:
                id: 1
                name: John Doe
                DOB: "1900-01-01"
                email: johnd@email.com
                password: password123
        get:
          tags:
            - Members:
          summary: "Returns all Members"
          description: "Endpoint to retrive a list of all members."
          responses:
            "200":
              description: "Retrieved Members Successfully"
              schema:
                $ref: "#/definitions/AllMembers"

        put:
          tags:
            - Members
          summary: "Endpoint to update a user."
          desciption: "Endpoint to update a member, this is a token authenicate route, and the user must be logged in to update their account."
          security:
            - bearerAuth: []
          parameters:
            - in: "body"
              name: "body"
              description: "Information required to update a Member."
              required: true
              schema:
                $ref: "#/definitions/UpdateMemberPayload"
          responses:
            200:
              descriptions: "Successfully Updated member"
              schema:
                $ref: "#/definitions/UpdateMemberResponse"
              exmaples:
                application/json:
                  id: 1
                  name: Dohn Joe
                  DOB: "1900-01-01"
                  email: dohn@email.com
                  password: password123
      delete:
        tags:
          - Members
        summary: "Endpiont to delete a member"
        description: "Endpoint to delete a member. Requires token authenticaiton, member must be logged in to delete their account"
        security:
          - bearerAuth: []
        responses:
          200:
            description: "Successfully Deleted member"
            schema:
              $ref: "#/definitions/DeleteMemberResponse"
            examples:
              application/json:
                message: "successfully deleted user <member_id>."



definitions:

  LoginCredentials:
    type: "object"
    properties:
      email:
        type: "string"
      password:
        type: "string"
      required:
        - email
        - password

  LoginResponse:
    type: "object"
    properties:
      token:
        type: "string"
      message:
        type: "string"
      status:
        type: "string"

  CreateMemberPayload:
    type: "object"
    properties:
      name:
        type: "string"
      email:
        type: "string"
      DOB:
        type: "string"
        format: date
      password:
        type: "string"

      required:
        - name
        - email
        - DOB
        - password

  CreateMemberResponse:
    type: "object"
    properties:
      id:
        type: "int"
      name:
        type: "string"
      email:
        type: "string"
      DOB:
        type: "string"
      password:
        type: "string"


  AllMembers:
    type: "array"
    items:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        email:
          type: "string"
        DOB:
          type: "string"
        password:
          type: "string"


  UpdateMemberPayload:
    type: "object"
    properties:
      name:
        type: "string"
      email:
        type: "string"
      DOB:
        type: "string"
        format: "date"
      password:
        type: "string"

    required:
      - name
      - email
      - DOB
      - password


  UpdateMemberResponse:
    type: "object"
    properties:
      id:
        type: "integer"
      name: 
        type: "string"
      email:
        type: "string"
      password:
        type: "string"


  DeleteMemberResponse:
    type: "object"
    properties:
      message:
        type: "string"
